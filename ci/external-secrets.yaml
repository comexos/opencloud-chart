# GitOps shape: Keycloak shared directory, every service secret from an
# existing Secret, no generated files and no config volume.
domain: example.org
serviceSecrets:
  existingSecret: opencloud-service-secrets
persistence:
  config:
    enabled: false
identity:
  mode: oidc
  oidc:
    issuer: https://keycloak.example.org/realms/openCloud
    autoprovision: false
    userClaim: uuid
    userCs3Claim: userid
    roleAssignment:
      mapping:
        - role_name: admin
          claim_value: opencloud-admins
        - role_name: user
          claim_value: opencloud-users
  ldap:
    uri: ldaps://openldap.identity.svc.cluster.local:636
    bindDn: cn=opencloud,ou=sysusers,dc=example,dc=org
    existingSecret: opencloud-ldap
    userBaseDn: ou=users,dc=example,dc=org
    groupBaseDn: ou=groups,dc=example,dc=org
    userSchemaId: entryUUID
    groupSchemaId: entryUUID
    disableUserMechanism: none
    writeEnabled: false
    serverUuid: true
