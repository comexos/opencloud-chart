---
# topology split: storage StatefulSet plus an autoscaled frontend, with an
# external NATS, Keycloak, a shared directory and S3 for the file content.
domain: "example.org"
topology: "split"
frontend:
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
nats:
  address: "nats.nats.svc.cluster.local:4222"
  existingSecret: "opencloud-nats"
serviceSecrets:
  existingSecret: "opencloud-service-secrets"
persistence:
  config:
    enabled: false
identity:
  mode: "oidc"
  oidc:
    issuer: "https://keycloak.example.org/realms/openCloud"
    autoprovision: false
    userClaim: "uuid"
    userCs3Claim: "userid"
  ldap:
    uri: "ldaps://openldap.identity.svc.cluster.local:636"
    bindDn: "cn=opencloud,ou=sysusers,dc=example,dc=org"
    existingSecret: "opencloud-ldap"
    userBaseDn: "ou=users,dc=example,dc=org"
    groupBaseDn: "ou=groups,dc=example,dc=org"
    userSchemaId: "entryUUID"
    groupSchemaId: "entryUUID"
    disableUserMechanism: "none"
    writeEnabled: false
    serverUuid: true
storage:
  driver: "decomposeds3"
  s3:
    endpoint: "http://s3.storage.svc.cluster.local:9000"
    bucket: "opencloud"
    existingSecret: "opencloud-s3"
antivirus:
  enabled: true
  clamavSocket: "tcp://clamav.antivirus.svc.cluster.local:3310"
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
ingress:
  enabled: true
  className: "nginx"
yjs:
  enabled: true
radicale:
  enabled: true
...
