{{- if .Values.radicale.enabled }}
{{- $ctx := dict "component" "radicale" "context" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opencloud.componentFullname" $ctx }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "opencloud.componentLabels" $ctx | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "opencloud.componentSelectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # A podSelector alone restricts peers to this namespace.
        - podSelector:
            matchLabels:
              {{- include "opencloud.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5232
{{- end }}
