{{- if .Values.tika.enabled }}
{{- $ctx := dict "component" "tika" "context" . }}
{{- $values := .Values.tika }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencloud.componentFullname" $ctx }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "opencloud.componentLabels" $ctx | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "opencloud.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opencloud.componentPodLabels" (merge (dict "podLabels" $values.podLabels) $ctx) | nindent 8 }}
      {{- with $values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "opencloud.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "common.images.renderPullSecrets" (dict "images" (list $values.image) "context" $) | nindent 6 }}
      {{- if $values.podSecurityContext.enabled }}
      securityContext:
        {{- omit $values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- with $values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tika
          image: {{ include "common.images.image" (dict "imageRoot" $values.image "global" .Values.global "chart" .Chart) | quote }}
          imagePullPolicy: {{ $values.image.pullPolicy }}
          {{- if $values.containerSecurityContext.enabled }}
          securityContext:
            {{- omit $values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 9998
          startupProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
