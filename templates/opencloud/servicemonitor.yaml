{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "opencloud.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "opencloud.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.serviceMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "opencloud.componentSelectorLabels" (dict "component" "metrics" "context" .) | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    # In single-process mode every service exposes the same registry, so the
    # proxy's debug endpoint covers all of OpenCloud.
    - port: debug
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      {{- with .Values.metrics.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      honorLabels: {{ .Values.metrics.serviceMonitor.honorLabels }}
      {{- if or .Values.metrics.token.existingSecret .Values.metrics.token.value }}
      authorization:
        type: Bearer
        credentials:
          {{- include "opencloud.secretRef" (dict "existingSecret" .Values.metrics.token.existingSecret "existingKey" .Values.metrics.token.secretKey "managedKey" "metricsToken" "context" .) | nindent 10 }}
      {{- end }}
      {{- with .Values.metrics.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metrics.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
