{{- if .Values.gatewayAPI.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "opencloud.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "opencloud.labels" . | nindent 4 }}
  annotations:
    {{- include "opencloud.annotations" (dict "specific" .Values.gatewayAPI.httpRoute.annotations "context" .) | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gatewayAPI.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- .Values.gatewayAPI.httpRoute.hostnames | default (list (include "opencloud.host" .)) | toYaml | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "opencloud.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
