{{- include "opencloud.validateValues" . }}
{{- include "opencloud.validateTopology" . }}
{{- $fullname := include "opencloud.fullname" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "opencloud.labels" . | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # topology single runs every service in one process with embedded NATS.
  # topology split runs the storage services here, which keep the files on
  # the data volume. Either way, the volume allows exactly one replica.
  replicas: {{ include "opencloud.storageReplicas" . }}
  serviceName: {{ $fullname }}-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "opencloud.selectorLabels" . | nindent 6 }}
  {{- include "opencloud.podTemplate" (dict "context" . "role" (include "opencloud.statefulRole" .)) }}
  {{- $templates := list }}
  {{- range $name, $persistent := dict "config" (eq (include "opencloud.configPersistent" $) "true") "data" $.Values.persistence.enabled }}
  {{- $shared := and (eq $name "data") (eq (include "opencloud.sharedData" $) "true") }}
  {{- if and $persistent (not (index $.Values.persistence $name).existingClaim) (not $shared) }}
  {{- $templates = append $templates $name }}
  {{- end }}
  {{- end }}
  {{- if $templates }}
  volumeClaimTemplates:
    {{- range $name := $templates }}
    {{- $p := index $.Values.persistence $name }}
    - metadata:
        name: {{ $name }}
      spec:
        accessModes:
          - {{ $p.accessMode | quote }}
        {{- include "common.storage.class" (dict "persistence" $p "global" $.Values.global) | nindent 8 }}
        resources:
          requests:
            storage: {{ $p.size | quote }}
    {{- end }}
  {{- end }}
