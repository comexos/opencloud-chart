name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish chart to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signature
    env:
      # renovate: datasource=github-releases depName=helm/helm
      HELM_VERSION: v4.3.0
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check the tag matches Chart.yaml
        run: |
          chart_version="$(helm show chart . | awk '/^version:/ {print $2}' | tr -d '"')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$chart_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Chart.yaml version $chart_version" >&2
            exit 1
          fi
          echo "CHART_VERSION=$chart_version" >> "$GITHUB_ENV"

      - name: Package chart
        run: |
          helm dependency list . | tail -n +2 | awk 'NF && $NF != "ok" { bad = 1 } END { exit bad }' \
            || { echo "charts/ does not match Chart.lock" >&2; exit 1; }
          helm package . --destination dist

      - name: Push to GHCR and sign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${OWNER,,}"
          echo "$GH_TOKEN" | helm registry login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          # cosign reads its own credentials; helm's login does not reach it.
          echo "$GH_TOKEN" | cosign login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          push_output="$(helm push "dist/opencloud-${CHART_VERSION}.tgz" "oci://$REGISTRY/$owner/charts")"
          echo "$push_output"
          digest="$(echo "$push_output" | awk '/^Digest:/ {print $2}')"
          if [ -z "$digest" ]; then
            echo "Could not read the pushed digest" >&2
            exit 1
          fi
          cosign sign --yes "$REGISTRY/$owner/charts/opencloud@$digest"
