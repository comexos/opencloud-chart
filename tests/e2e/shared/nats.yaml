---
# Single NATS server with JetStream for topology split (registry, events,
# caches, stores). A test stand-in for a NATS cluster; no authentication.
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "nats"
spec:
  replicas: 1
  selector:
    matchLabels: {app: "nats"}
  template:
    metadata:
      labels: {app: "nats"}
    spec:
      containers:
        - name: "nats"
          image: "docker.io/library/nats:2.15-alpine@sha256:823e7f1d6d8ffe3b30dbd73d4a06bbb939acf94929f7fdf224404da7a05bafb5"
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - {name: "client", containerPort: 4222}
          readinessProbe:
            httpGet: {path: "/healthz", port: 8222}
          volumeMounts:
            - {name: "data", mountPath: "/data"}
      volumes:
        - name: "data"
          emptyDir: {}
...
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "nats"
spec:
  selector: {app: "nats"}
  ports:
    - {name: "client", port: 4222}
...
